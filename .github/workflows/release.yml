name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name to build (defaults to current ref)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: exposure-linux-x86_64
            bin: exposure
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: exposure-linux-aarch64
            bin: exposure
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: exposure-windows-x86_64.exe
            bin: exposure.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Zig & cargo-zigbuild (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install --locked cargo-zigbuild

      - name: Build binary (Linux x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p exposure-cli

      - name: Build binary (Linux aarch64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --target ${{ matrix.target }} -p exposure-cli

      - name: Build binary (Windows x86_64 MSVC)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --release --target ${{ matrix.target }} -p exposure-cli

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release-assets/${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release-assets && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  publish-release-assets:
    name: Attach Assets to GitHub Release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum exposure-linux-x86_64 exposure-linux-aarch64 exposure-windows-x86_64.exe > SHA256SUMS.txt
          ls -lh

      - name: Upload assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/exposure-linux-x86_64 \
            release-assets/exposure-linux-aarch64 \
            release-assets/exposure-windows-x86_64.exe \
            release-assets/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber
