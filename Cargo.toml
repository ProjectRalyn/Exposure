[workspace]
resolver = "2"
members = [
    "crates/exposure-core",
    "crates/exposure-link",
    "crates/exposure-node",
    "crates/exposure-control",
    "crates/exposure-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["ProjectRalyn <ralyn@d2lib.com>"]
license = "MIT"

[workspace.dependencies]
exposure-core = { path = "crates/exposure-core" }
exposure-link = { path = "crates/exposure-link" }
exposure-node = { path = "crates/exposure-node" }
exposure-control = { path = "crates/exposure-control" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
ipnet = { version = "2", features = ["serde"] }
rand = "0.8"
rcgen = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
evilpot = { version = "0.1.1", default-features = false }
snow = "0.9"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["compat", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
yamux = "0.13"
