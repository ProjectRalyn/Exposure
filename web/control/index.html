<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exposure Control</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Login View -->
  <section id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="login-head-row">
        <div class="brand-tag" data-i18n="brand.tag">EXPOSURE CONTROL</div>
        <button type="button" id="btn-login-lang" class="btn sm ghost">中文 / EN</button>
      </div>
      <h1 data-i18n="login.title">Sign in to Control Plane</h1>
      <p class="muted-sm" data-i18n="login.subtitle">Authenticate to manage hosts, services, smart DNS, security guards, and mesh topology.</p>
      <label>
        <span data-i18n="login.username">Username</span>
        <input id="login-user" type="text" autocomplete="username" required value="admin" />
      </label>
      <label>
        <span data-i18n="login.password">Password</span>
        <input id="login-pass" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn primary" data-i18n="login.submit">Sign In</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </section>

  <!-- App Shell -->
  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand" data-i18n="brand.name">EXPOSURE</div>
        <span id="control-role-badge" class="pill ok">ACTIVE</span>
      </div>

      <div id="sidebar-bootstrap-status" class="bootstrap-card">
        <span class="live-dot draft"></span>
        <div class="bootstrap-card-text">
          <div class="bootstrap-card-lbl" data-i18n="sidebar.bootstrap">Bootstrap Link</div>
          <div class="bootstrap-card-val" data-i18n="sidebar.checking">Checking…</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-group-label" data-i18n="nav.group.monitor">Monitor</div>
        <button class="nav-item active" data-tab="overview">
          <span class="nav-ic">◈</span>
          <span class="nav-txt" data-i18n="nav.overview">Overview</span>
        </button>
        <button class="nav-item" data-tab="analytics">
          <span class="nav-ic">▤</span>
          <span class="nav-txt" data-i18n="nav.analytics">Analytics</span>
        </button>
        <button class="nav-item" data-tab="logging">
          <span class="nav-ic">◎</span>
          <span class="nav-txt" data-i18n="nav.logging">Logging</span>
        </button>

        <div class="nav-group-label" data-i18n="nav.group.configure">Configure</div>
        <button class="nav-item" data-tab="hosts">
          <span class="nav-ic">◫</span>
          <span class="nav-txt" data-i18n="nav.hosts">Hosts</span>
          <span id="nav-badge-hosts" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-tab="services">
          <span class="nav-ic">⚡</span>
          <span class="nav-txt" data-i18n="nav.services">Services</span>
          <span id="nav-badge-services" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-tab="domains">
          <span class="nav-ic">◉</span>
          <span class="nav-txt" data-i18n="nav.domains">Domains &amp; DNS</span>
          <span id="nav-badge-domains" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-tab="security">
          <span class="nav-ic">⛨</span>
          <span class="nav-txt" data-i18n="nav.security">Security</span>
        </button>
        <button class="nav-item" data-tab="topology">
          <span class="nav-ic">❖</span>
          <span class="nav-txt" data-i18n="nav.topology">Topology</span>
        </button>

        <div class="nav-group-label" data-i18n="nav.group.system">System</div>
        <button class="nav-item" data-tab="system">
          <span class="nav-ic">⚙</span>
          <span class="nav-txt" data-i18n="nav.system">System</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="lang-switch">
          <button type="button" class="lang-btn" data-lang="zh-CN">中文</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <button id="btn-logout" class="btn ghost full" data-i18n="auth.signout">Sign Out</button>
      </div>
    </aside>

    <main class="main">
      <!-- Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="page-title">Overview</h2>
          <span id="topbar-updated" class="topbar-meta"></span>
        </div>
        <div class="topbar-actions">
          <select id="sel-time-window" class="select-sm" title="Stats time window">
            <option value="300" data-i18n="topbar.window.5m">Window: 5m</option>
            <option value="900" data-i18n="topbar.window.15m">Window: 15m</option>
            <option value="3600" selected data-i18n="topbar.window.1h">Window: 1h</option>
            <option value="86400" data-i18n="topbar.window.24h">Window: 24h</option>
            <option value="0" data-i18n="topbar.window.all">Window: All</option>
          </select>
          <select id="sel-auto-refresh" class="select-sm" title="Auto refresh interval">
            <option value="0" data-i18n="topbar.auto.off">Auto: Off</option>
            <option value="10000" data-i18n="topbar.auto.10s">Auto: 10s</option>
            <option value="30000" selected data-i18n="topbar.auto.30s">Auto: 30s</option>
          </select>
          <button id="btn-pull-all" class="btn sm" data-i18n="topbar.pull">Pull Telemetry</button>
          <button id="btn-discover" class="btn sm" data-i18n="topbar.discover">Discover</button>
          <button id="btn-refresh" class="btn sm primary" data-i18n="topbar.refresh">Refresh</button>
        </div>
      </header>

      <!-- Global Draft & Deploy Bar (Always available across configuration tabs) -->
      <div id="global-deploy-bar" class="deploy-bar hidden">
        <div class="deploy-bar-left">
          <span id="deploy-status-pill" class="pill ok">All changes deployed</span>
          <div class="btn-row">
            <button id="btn-global-undo" class="btn sm ghost" disabled title="Undo (Ctrl+Z)">↶</button>
            <button id="btn-global-redo" class="btn sm ghost" disabled title="Redo (Ctrl+Y)">↷</button>
            <button id="btn-global-diff" class="btn sm ghost hidden" data-i18n="deploy.diff">Diff</button>
            <button id="btn-global-discard" class="btn sm ghost hidden" data-i18n="deploy.discard">Discard Draft</button>
          </div>
        </div>
        <div class="deploy-bar-right">
          <button id="btn-global-validate" class="btn sm" data-i18n="deploy.validate">Validate</button>
          <button id="btn-global-preflight" class="btn sm" data-i18n="deploy.preflight">Preflight</button>
          <button id="btn-global-save-draft" class="btn sm" data-i18n="deploy.save_draft">Save Draft</button>
          <button id="btn-global-deploy" class="btn sm primary" data-i18n="deploy.push_all">Deploy &amp; Push</button>
          <button id="btn-global-deploy-dns" class="btn sm accent-outline" data-i18n="deploy.push_and_dns">Deploy + Sync DNS</button>
        </div>
      </div>

      <!-- Global Validation / Error Strip -->
      <div id="global-val-bar" class="val-bar hidden"></div>

      <!-- 1. Overview -->
      <section id="tab-overview" class="tab-panel"></section>

      <!-- 2. Hosts (Nodes + Links + Onboarding) -->
      <section id="tab-hosts" class="tab-panel hidden"></section>

      <!-- 3. Services (Service-Centric Declarative Exposure) -->
      <section id="tab-services" class="tab-panel hidden"></section>

      <!-- 4. Domains & DNS (Split-Horizon + Remote Records + Certs + Providers) -->
      <section id="tab-domains" class="tab-panel hidden"></section>

      <!-- 5. Security (Guards + Buckets + Custom Pages with Preview) -->
      <section id="tab-security" class="tab-panel hidden"></section>

      <!-- 6. Topology (Pure Physical Mesh Canvas & Service Route Tracer) -->
      <section id="tab-topology" class="tab-panel hidden"></section>

      <!-- 7. Analytics -->
      <section id="tab-analytics" class="tab-panel hidden"></section>

      <!-- 8. Logging (Access URL Logs + Visitor & Fingerprint Explorer) -->
      <section id="tab-logging" class="tab-panel hidden"></section>

      <!-- 9. System (Defaults + Versions + Audit + YAML) -->
      <section id="tab-system" class="tab-panel hidden"></section>
    </main>
  </div>

  <!-- Floating Toast Stack -->
  <div id="toast-stack" class="toast-stack"></div>

  <!-- Slide-Over Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden">
    <aside id="drawer-panel" class="drawer-panel">
      <div class="drawer-head">
        <div>
          <h3 id="drawer-title">Details</h3>
          <div id="drawer-subtitle" class="muted-sm hidden"></div>
        </div>
        <button id="btn-drawer-close" class="btn sm ghost" type="button">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
      <div id="drawer-footer" class="drawer-footer hidden"></div>
    </aside>
  </div>

  <!-- Reusable Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">Details</h3>
        <button id="btn-modal-close" class="btn sm ghost" type="button">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
