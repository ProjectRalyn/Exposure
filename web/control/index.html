<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exposure Control</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Login View -->
  <section id="login-view" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="login-head-row">
        <div class="brand-tag">EXPOSURE CONTROL</div>
        <select id="sel-lang-login" class="select-sm lang-select" title="Language"></select>
      </div>
      <h1>Sign in to Control Plane</h1>
      <p class="muted-sm">Authenticate to manage hosts, services, smart DNS, security guards, and mesh topology.</p>
      <label>
        <span>Username</span>
        <input id="login-user" type="text" autocomplete="username" required value="admin" />
      </label>
      <label>
        <span>Password</span>
        <input id="login-pass" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn primary">Sign In</button>
      <p id="login-error" class="error hidden"></p>
    </form>
  </section>

  <!-- App Shell -->
  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">EXPOSURE</div>
        <span id="control-role-badge" class="pill ok">ACTIVE</span>
      </div>

      <div id="sidebar-bootstrap-status" class="bootstrap-card">
        <span class="live-dot draft"></span>
        <div class="bootstrap-card-text">
          <div class="bootstrap-card-lbl">Bootstrap Link</div>
          <div class="bootstrap-card-val">Checking…</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-group-label">Monitor</div>
        <button class="nav-item active" data-tab="overview">
          <span class="nav-ic">◈</span>
          <span class="nav-txt">Overview</span>
        </button>
        <button class="nav-item" data-tab="analytics">
          <span class="nav-ic">▤</span>
          <span class="nav-txt">Analytics</span>
        </button>
        <button class="nav-item" data-tab="logging">
          <span class="nav-ic">◎</span>
          <span class="nav-txt">Logging</span>
        </button>

        <div class="nav-group-label">Configure</div>
        <button class="nav-item" data-tab="hosts">
          <span class="nav-ic">◫</span>
          <span class="nav-txt">Hosts</span>
          <span id="nav-badge-hosts" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-tab="services">
          <span class="nav-ic">⚡</span>
          <span class="nav-txt">Services</span>
          <span id="nav-badge-services" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-tab="domains">
          <span class="nav-ic">◉</span>
          <span class="nav-txt">Domains &amp; DNS</span>
          <span id="nav-badge-domains" class="nav-badge">0</span>
        </button>
        <button class="nav-item" data-tab="security">
          <span class="nav-ic">⛨</span>
          <span class="nav-txt">Security</span>
        </button>
        <button class="nav-item" data-tab="topology">
          <span class="nav-ic">❖</span>
          <span class="nav-txt">Topology</span>
        </button>

        <div class="nav-group-label">System</div>
        <button class="nav-item" data-tab="system">
          <span class="nav-ic">⚙</span>
          <span class="nav-txt">System</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-switches">
          <div class="lang-switch" title="Theme">
            <button type="button" class="theme-btn" data-theme-val="dark">Dark</button>
            <button type="button" class="theme-btn" data-theme-val="light">Light</button>
          </div>
          <select id="sel-lang" class="select-sm lang-select" title="Language"></select>
        </div>
        <button id="btn-logout" class="btn ghost full">Sign Out</button>
      </div>
    </aside>

    <main class="main">
      <!-- Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="page-title">Overview</h2>
          <span id="topbar-updated" class="topbar-meta"></span>
        </div>
        <div class="topbar-actions">
          <select id="sel-time-window" class="select-sm" title="Stats time window">
            <option value="300">Window: 5m</option>
            <option value="900">Window: 15m</option>
            <option value="1800">Window: 30m</option>
            <option value="3600" selected>Window: 1h</option>
            <option value="21600">Window: 6h</option>
            <option value="43200">Window: 12h</option>
            <option value="86400">Window: 24h</option>
            <option value="604800">Window: 7d</option>
            <option value="2592000">Window: 30d</option>
            <option value="0">Window: All</option>
            <option value="custom">Window: Custom…</option>
          </select>
          <div id="time-custom-wrap" class="time-custom-wrap hidden">
            <input id="inp-time-from" type="datetime-local" class="input-sm" title="Start time" />
            <span class="muted-sm">→</span>
            <input id="inp-time-to" type="datetime-local" class="input-sm" title="End time" />
            <button id="btn-time-apply" type="button" class="btn sm primary">Apply</button>
          </div>
          <select id="sel-auto-refresh" class="select-sm" title="Auto refresh interval">
            <option value="0">Auto: Off</option>
            <option value="10000">Auto: 10s</option>
            <option value="30000" selected>Auto: 30s</option>
          </select>
          <button id="btn-pull-all" class="btn sm">Pull Telemetry</button>
          <button id="btn-discover" class="btn sm">Discover</button>
          <button id="btn-refresh" class="btn sm primary">Refresh</button>
        </div>
      </header>

      <!-- Global Draft & Deploy Bar (Always available across configuration tabs) -->
      <div id="global-deploy-bar" class="deploy-bar hidden">
        <div class="deploy-bar-left">
          <span id="deploy-status-pill" class="pill ok">All changes deployed</span>
          <div class="btn-row">
            <button id="btn-global-undo" class="btn sm ghost" disabled title="Undo (Ctrl+Z)">↶</button>
            <button id="btn-global-redo" class="btn sm ghost" disabled title="Redo (Ctrl+Y)">↷</button>
            <button id="btn-global-diff" class="btn sm ghost hidden">Diff</button>
            <button id="btn-global-discard" class="btn sm ghost hidden">Discard Draft</button>
          </div>
        </div>
        <div class="deploy-bar-right">
          <button id="btn-global-validate" class="btn sm">Validate</button>
          <button id="btn-global-preflight" class="btn sm">Preflight</button>
          <button id="btn-global-save-draft" class="btn sm">Save Draft</button>
          <button id="btn-global-deploy" class="btn sm primary">Deploy &amp; Push</button>
          <button id="btn-global-deploy-dns" class="btn sm accent-outline">Deploy + Sync DNS</button>
        </div>
      </div>

      <!-- Global Validation / Error Strip -->
      <div id="global-val-bar" class="val-bar hidden"></div>

      <!-- 1. Overview -->
      <section id="tab-overview" class="tab-panel"></section>

      <!-- 2. Hosts (Nodes + Links + Onboarding) -->
      <section id="tab-hosts" class="tab-panel hidden"></section>

      <!-- 3. Services (Service-Centric Declarative Exposure) -->
      <section id="tab-services" class="tab-panel hidden"></section>

      <!-- 4. Domains & DNS (Split-Horizon + Remote Records + Certs + Providers) -->
      <section id="tab-domains" class="tab-panel hidden"></section>

      <!-- 5. Security (Guards + Buckets + Custom Pages with Preview) -->
      <section id="tab-security" class="tab-panel hidden"></section>

      <!-- 6. Topology (Pure Physical Mesh Canvas & Service Route Tracer) -->
      <section id="tab-topology" class="tab-panel hidden"></section>

      <!-- 7. Analytics -->
      <section id="tab-analytics" class="tab-panel hidden"></section>

      <!-- 8. Logging (Access URL Logs + Visitor & Fingerprint Explorer) -->
      <section id="tab-logging" class="tab-panel hidden"></section>

      <!-- 9. System (Defaults + Versions + Audit + YAML) -->
      <section id="tab-system" class="tab-panel hidden"></section>
    </main>
  </div>

  <!-- Floating Toast Stack -->
  <div id="toast-stack" class="toast-stack"></div>

  <!-- Slide-Over Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop hidden">
    <aside id="drawer-panel" class="drawer-panel">
      <div class="drawer-head">
        <div>
          <h3 id="drawer-title">Details</h3>
          <div id="drawer-subtitle" class="muted-sm hidden"></div>
        </div>
        <button id="btn-drawer-close" class="btn sm ghost" type="button">✕</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
      <div id="drawer-footer" class="drawer-footer hidden"></div>
    </aside>
  </div>

  <!-- Reusable Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">Details</h3>
        <button id="btn-modal-close" class="btn sm ghost" type="button">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
