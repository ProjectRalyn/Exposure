<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{{status}} {{title}}</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<main class="page {{tone}}">
  <section class="col">
    <div class="tag">HTTP {{status}}</div>
    <h1>{{title}}</h1>
    <div class="rule"></div>
    <p class="detail">{{detail}}</p>
    {{retry_note}}
    <div class="foot"><span>Exposure Edge</span><span>Ray {{ray_id}}</span></div>
  </section>
  <div class="art-layer">
    <div class="art">
      <!-- @inline art.svg -->
    </div>
  </div>
</main>
</body>
</html>
