<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Security Check</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <section class="col">
      <div class="tag">Security Check</div>
      <h1>Verifying your browser</h1>
      <div class="rule"></div>
      <p id="status-text" class="detail">Running a lightweight proof-of-work check before forwarding your request.</p>
      <div class="track">
        <div id="progress-bar" class="bar"></div>
      </div>
      <dl class="meta">
        <div><dt>Difficulty</dt><dd id="meta-difficulty">--</dd></div>
        <div><dt>Hashes</dt><dd id="meta-hashes">0</dd></div>
      </dl>
      <p id="error-text" class="error hidden"></p>
      <div class="foot">
        <span>Exposure Edge</span>
        <span>PoW / SHA-256</span>
      </div>
    </section>
    <div class="art-layer">
      <div class="art">
        <!-- @inline art.svg -->
      </div>
    </div>
  </main>
  <script type="module" src="./pow.js"></script>
</body>
</html>
