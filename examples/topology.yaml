# Example Exposure Topology Specification (loaded into Control & compiled to all Nodes)
defaults:
  ingress:
    server_header: "nginx"
    cert_store_dir: "./data/ingress-certs"
    # Replace with your own 32-byte random hex secret (e.g. `openssl rand -hex 32`)
    clearance_secret: "9f8e7d6c5b4a392817162534435261708f9ea0b1c2d3e4f5a6b7c8d9e0f1a2b3"
    default_guard: "standard"
    intercept_errors: false
    js_fp_beacon: true
    js_fp_ttl_secs: 3600
  guard:
    antibot: challenge
    rate_limit_bucket: web-default
    challenge_threshold: 50
    reject_threshold: 85
    pow_difficulty: 16
    clearance_ttl_secs: 600
    bind_ua: true
    bind_ip_prefix: true
    block_bots: false
    block_headless: true
    require_client_fp: false
    js_fp_beacon: true
    js_fp_ttl_secs: 3600
  egress:
    protocol: auto
    timeout_ms: 15000
    tls: false
    insecure_skip_verify: false
    allow_any_origin: false
    intercept_errors: false
  link_listener:
    allow_on_demand: true
    allow_tunnel: true
    # Keep bootstrap disabled after initial node onboarding
    allow_bootstrap: false

# Globally reusable rate-limit buckets selectable by any Guard template or Ingress node
bucket_templates:
  web-default:
    capacity: 60
    refill_per_sec: 10
  strict-api:
    capacity: 20
    refill_per_sec: 4

# Globally reusable Guard templates selectable directly on Ingress rules
guard_templates:
  standard:
    antibot: challenge
    rate_limit_bucket: web-default
    challenge_threshold: 50
    reject_threshold: 85
    pow_difficulty: 16
    clearance_ttl_secs: 1800
    waf:
      mode: monitor
      min_confidence: 0.65
      inspect_headers: true
      inspect_body: true
      max_body_bytes: 32768
  under-attack:
    antibot: always
    rate_limit_bucket: strict-api
    pow_difficulty: 18
    block_bots: true
    block_headless: true
    require_client_fp: true
    waf:
      mode: block
      min_confidence: 0.60
      inspect_headers: true
      inspect_body: true
      max_body_bytes: 32768

dns_providers:
  cf-prod:
    type: cloudflare
    api_token: "replace-with-real-api-token"
  # aliyun-main:
  #   type: aliyun
  #   access_key_id: "replace-with-ram-access-key-id"
  #   access_key_secret: "replace-with-ram-access-key-secret"
  #   region_id: "cn-hangzhou"

domains:
  example.com:
    provider: "cf-prod"
    # Optional for Cloudflare (auto-queried when omitted)
    zone_id: "0123456789abcdef0123456789abcdef"
    # Declarative split-horizon DNS routing (Aliyun supports telecom/unicom/mobile/oversea/default lines)
    line_routes:
      - line: "default"
        target_nodes: ["ingress-hk"]
        ttl: 600
      # - line: "telecom"
      #   target_nodes: ["ingress-cn-ct"]
      #   ttl: 600
    ttl: 600
    proxied: false

# Service-centric declarative exposure: define once, auto-compiles to all selected Ingress, Relay & Egress hosts
services:
  web-main:
    hosts:
      - "example.com"
    ingress:
      mode: all  # Automatically applies to every Ingress host (or use `selected` / `exclude`)
    guard: "standard"
    egress:
      node: "egress-home"
      backend: "192.168.1.3:10808"
      local_health_check:
        enabled: true
        interval_secs: 10
        timeout_ms: 2000
    routing:
      mode: auto # Auto-computes shortest mesh path through relays and generates Relay rules + Egress allow_from ACLs
    auto_tls: true

nodes:
  ingress-hk:
    roles:
      ingress: true
    external_ips:
      - "203.0.113.10"
    link_listener:
      listen_addr: "0.0.0.0:9443"
    maintainer_hops:
      - ingress-hk
      - relay-sg
      - maintainer-1
    ingress:
      listeners:
        - listen_addr: "0.0.0.0:8080"
          tls: false
        - listen_addr: "0.0.0.0:8443"
          tls: true

  relay-sg:
    roles:
      relay: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
    maintainer_hops:
      - relay-sg
      - maintainer-1

  egress-home:
    roles:
      egress: true
    maintainer_hops:
      - egress-home
      - relay-sg
      - maintainer-1

  maintainer-1:
    roles:
      maintainer: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
    maintainer_template: "default-maint"

links:
  - from: ingress-hk
    to: relay-sg
    mode: on-demand
    bidirectional: true
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
    reverse_endpoints:
      - address: "ingress-hk.internal:9443"
        priority: 10
        weight: 100
  - from: egress-home
    to: relay-sg
    mode: tunnel
    tunnel_direction: outbound
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
  - from: relay-sg
    to: maintainer-1
    mode: on-demand
    bidirectional: true
    endpoints:
      - address: "maintainer-1.internal:9443"
        priority: 10
        weight: 100
    reverse_endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100

maintainer_templates:
  default-maint:
    is_primary_cert_manager: true
    acme:
      # Use "self-signed" for local/internal cert issuance
      directory_url: "self-signed"
      contact_email: "ops@example.com"
      storage_dir: "./data/maintainer-certs"
      orders:
        - domain: "example.com"
          # `provider` is optional — automatically resolved from `domains` (exact or longest-suffix match)
          target_nodes: ["ingress-hk"]
          target_hops:
            ingress-hk: ["maintainer-1", "relay-sg", "ingress-hk"]
          renew_before_days: 30
