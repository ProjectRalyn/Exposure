# Example Exposure Topology Specification (loaded into Control & compiled to all Nodes)
defaults:
  ingress:
    server_header: "nginx"
    cert_store_dir: "./data/ingress-certs"
    # Replace with your own 32-byte random hex secret (e.g. `openssl rand -hex 32`)
    clearance_secret: "9f8e7d6c5b4a392817162534435261708f9ea0b1c2d3e4f5a6b7c8d9e0f1a2b3"
    default_guard: "standard"
    intercept_errors: false
    js_fp_beacon: true
    js_fp_ttl_secs: 3600
  guard:
    antibot: challenge
    rate_limit_bucket: web-default
    challenge_threshold: 50
    reject_threshold: 85
    pow_difficulty: 16
    clearance_ttl_secs: 600
    bind_ua: true
    bind_ip_prefix: true
    block_bots: false
    block_headless: true
    require_client_fp: false
    js_fp_beacon: true
    js_fp_ttl_secs: 3600
  egress:
    protocol: auto
    timeout_ms: 15000
    tls: false
    insecure_skip_verify: false
    allow_any_origin: false
    intercept_errors: false
  link_listener:
    allow_on_demand: true
    allow_tunnel: true
    # Keep bootstrap disabled after initial node onboarding
    allow_bootstrap: false

# Globally reusable rate-limit buckets selectable by any Guard template or Ingress node
bucket_templates:
  web-default:
    capacity: 60
    refill_per_sec: 10
  strict-api:
    capacity: 20
    refill_per_sec: 4

# Globally reusable Guard templates selectable directly on Ingress rules
guard_templates:
  standard:
    antibot: challenge
    rate_limit_bucket: web-default
    challenge_threshold: 50
    reject_threshold: 85
    pow_difficulty: 16
    clearance_ttl_secs: 1800
  under-attack:
    antibot: always
    rate_limit_bucket: strict-api
    pow_difficulty: 18
    block_bots: true
    block_headless: true
    require_client_fp: true

nodes:
  ingress-hk:
    roles:
      ingress: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
    maintainer_hops:
      - ingress-hk
      - relay-sg
      - maintainer-1
    ingress:
      listeners:
        - listen_addr: "0.0.0.0:8080"
          tls: false
        - listen_addr: "0.0.0.0:8443"
          tls: true
      rules:
        - name: web-region-a
          match:
            host: "example.com"
            source_cidrs: ["203.0.113.0/24"]
          service_tag: "web@region-a"
          next_peer: "relay-sg"
          # Inherits defaults.ingress.default_guard ("standard")
        - name: web-default
          match:
            host: "example.com"
          service_tag: "web@default"
          next_peer: "relay-sg"
          guard: "standard"

  relay-sg:
    roles:
      relay: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
    maintainer_hops:
      - relay-sg
      - maintainer-1
    relay:
      rules:
        - service_tag: "web@region-a"
          next_peer: "egress-home"
        - service_tag: "web@default"
          next_peer: "egress-home"

  egress-home:
    roles:
      egress: true
    maintainer_hops:
      - egress-home
      - relay-sg
      - maintainer-1
    egress:
      services:
        web@region-a:
          backend: "192.168.1.3:10808"
          # Inherits protocol/timeout/tls defaults; override any option with true/false
          allow_from: ["ingress-hk"]
          local_health_check:
            enabled: true
            interval_secs: 10
            timeout_ms: 2000
        web@default:
          backend: "192.168.1.3:10808"
          allow_from: ["ingress-hk"]

  maintainer-1:
    roles:
      maintainer: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
    maintainer_template: "default-maint"

links:
  - from: ingress-hk
    to: relay-sg
    mode: on-demand
    bidirectional: true
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
    reverse_endpoints:
      - address: "ingress-hk.internal:9443"
        priority: 10
        weight: 100
  - from: egress-home
    to: relay-sg
    mode: tunnel
    tunnel_direction: outbound
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
  - from: relay-sg
    to: maintainer-1
    mode: on-demand
    bidirectional: true
    endpoints:
      - address: "maintainer-1.internal:9443"
        priority: 10
        weight: 100
    reverse_endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100

maintainer_templates:
  default-maint:
    is_primary_cert_manager: true
    acme:
      # Use "self-signed" for local/internal cert issuance
      directory_url: "self-signed"
      contact_email: "ops@example.com"
      storage_dir: "./data/maintainer-certs"
      providers:
        cf-prod:
          type: cloudflare
          api_token: "replace-with-real-api-token"
          zone_id: "0123456789abcdef0123456789abcdef"
      orders:
        - domain: "example.com"
          provider: "cf-prod"
          target_nodes: ["ingress-hk"]
          target_hops:
            ingress-hk: ["maintainer-1", "relay-sg", "ingress-hk"]
          renew_before_days: 30
