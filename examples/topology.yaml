# Example Exposure Topology Specification (loaded into Control & compiled to all Nodes)
nodes:
  ingress-hk:
    roles:
      ingress: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
      allow_on_demand: true
      allow_tunnel: true
      allow_bootstrap: true
    maintainer_hops:
      - ingress-hk
      - relay-sg
      - maintainer-1
    ingress:
      listeners:
        - listen_addr: "0.0.0.0:8080"
          tls: false
        - listen_addr: "0.0.0.0:8443"
          tls: true
      cert_store_dir: "./data/ingress-certs"
      clearance_secret: "change-this-in-production"
      rate_limit_buckets:
        web-default:
          capacity: 60
          refill_per_sec: 10
          per_ip: true
      guards:
        standard:
          antibot: challenge
          rate_limit_bucket: web-default
          challenge_threshold: 50
          reject_threshold: 85
          pow_difficulty: 16
          clearance_ttl_secs: 1800
          bind_ua: true
      rules:
        - name: web-region-a
          match:
            host: "example.com"
            source_cidrs: ["203.0.113.0/24"]
          service_tag: "web@region-a"
          next_peer: "relay-sg"
          guard: "standard"
        - name: web-default
          match:
            host: "example.com"
          service_tag: "web@default"
          next_peer: "relay-sg"
          guard: "standard"

  relay-sg:
    roles:
      relay: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
      allow_on_demand: true
      allow_tunnel: true
      allow_bootstrap: false
    maintainer_hops:
      - relay-sg
      - maintainer-1
    relay:
      rules:
        - service_tag: "web@region-a"
          next_peer: "egress-home"
        - service_tag: "web@default"
          next_peer: "egress-home"

  egress-home:
    roles:
      egress: true
    maintainer_hops:
      - egress-home
      - relay-sg
      - maintainer-1
    egress:
      services:
        web@region-a:
          backend: "192.168.1.3:10808"
          protocol: auto
          allow_from: ["ingress-hk"]
          timeout_ms: 15000
          local_health_check:
            enabled: true
            interval_secs: 10
            timeout_ms: 2000
        web@default:
          backend: "192.168.1.3:10808"
          protocol: auto
          allow_from: ["ingress-hk"]
          timeout_ms: 15000

  maintainer-1:
    roles:
      maintainer: true
    link_listener:
      listen_addr: "0.0.0.0:9443"
      allow_on_demand: true
      allow_tunnel: true
      allow_bootstrap: false
    maintainer_template: "default-maint"

links:
  - from: ingress-hk
    to: relay-sg
    mode: on-demand
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
  - from: egress-home
    to: relay-sg
    mode: tunnel
    tunnel_direction: outbound
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
  - from: relay-sg
    to: maintainer-1
    mode: on-demand
    endpoints:
      - address: "maintainer-1.internal:9443"
        priority: 10
        weight: 100
  - from: maintainer-1
    to: relay-sg
    mode: on-demand
    endpoints:
      - address: "relay-sg.internal:9443"
        priority: 10
        weight: 100
  - from: relay-sg
    to: ingress-hk
    mode: on-demand
    endpoints:
      - address: "ingress-hk.internal:9443"
        priority: 10
        weight: 100

maintainer_templates:
  default-maint:
    is_primary_cert_manager: true
    acme:
      directory_url: "https://acme-v02.api.letsencrypt.org/directory"
      contact_email: "ops@example.com"
      storage_dir: "./data/maintainer-certs"
      providers:
        cf-prod:
          type: cloudflare
          api_token: "replace-me"
          zone_id: "replace-me"
      orders:
        - domain: "example.com"
          provider: "cf-prod"
          target_nodes: ["ingress-hk"]
          target_hops:
            ingress-hk: ["maintainer-1", "relay-sg", "ingress-hk"]
          renew_before_days: 30
